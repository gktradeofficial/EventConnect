{% extends "base.html" %}

{% block title %}Edit Availability | EventSetu{% endblock %}

{% block content %}

<style>

    .availability-page {
        min-height: calc(100vh - 70px);
        background: #f5f7fb;
        padding: 50px 20px 80px;
    }

    .availability-card {
        max-width: 600px;
        margin: auto;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    .availability-card h1 {
        color: #111827;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .subtitle {
        color: #6b7280;
        font-size: 14px;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #374151;
        font-size: 13px;
        font-weight: 700;
    }

    input,
    select {
        width: 100%;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        box-sizing: border-box;
    }

    input:focus,
    select:focus {
        border-color: #f59e0b;
        box-shadow: 0 0 0 3px rgba(245,158,11,.12);
    }

    .current-status {
        padding: 13px 15px;
        background: #f9fafb;
        border-radius: 10px;
        margin-bottom: 22px;
        color: #6b7280;
        font-size: 13px;
    }

    .button-row {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .save-btn {
        flex: 1;
        border: none;
        padding: 14px;
        border-radius: 10px;
        background: linear-gradient(135deg,#f59e0b,#d97706);
        color: #111827;
        font-weight: 800;
        cursor: pointer;
    }

    .back-btn {
        flex: 1;
        text-align: center;
        padding: 14px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        text-decoration: none;
        color: #374151;
        font-weight: 700;
        box-sizing: border-box;
    }

    .back-btn:hover {
        border-color: #f59e0b;
        color: #d97706;
    }

    @media(max-width:600px) {

        .availability-card {
            padding: 22px;
        }

        .button-row {
            flex-direction: column;
        }

    }

</style>


<div class="availability-page">

    <div class="availability-card">

        <h1>
            ✏️ Edit Availability
        </h1>

        <p class="subtitle">
            Update your availability for this date.
        </p>


        <div class="current-status">

            Current Date:
            <strong>
                {{ availability.date|date:"d M Y" }}
            </strong>

        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    name="date"
                    id="date"
                    value="{{ availability.date|date:'Y-m-d' }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="is_available">
                    Availability Status
                </label>

                <select
                    name="is_available"
                    id="is_available"
                >

                    <option
                        value="true"
                        {% if availability.is_available %}
                            selected
                        {% endif %}
                    >
                        🟢 Available
                    </option>

                    <option
                        value="false"
                        {% if not availability.is_available %}
                            selected
                        {% endif %}
                    >
                        🔴 Not Available / Booked
                    </option>

                </select>

            </div>


            <div class="button-row">

                <button
                    type="submit"
                    class="save-btn"
                >
                    💾 Save Changes
                </button>

                <a
                    href="{% url 'professional_dashboard' %}"
                    class="back-btn"
                >
                    ← Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
